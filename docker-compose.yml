services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lab3
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: labpass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d lab3"]
      interval: 5s
      retries: 10
  web:
    build: .
    env_file: .env
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
