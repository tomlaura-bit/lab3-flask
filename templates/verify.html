{% extends 'base.html' %}{% block content %}
<section class="card narrow"><h1>Verificar correo</h1><p>Introduce el código enviado a tu correo. Caduca en 10 minutos.</p>
<form method="post"><input type="hidden" name="csrf" value="{{ csrf_token() }}">
<label>Código de seis dígitos<input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autofocus></label>
<button class="primary">Verificar</button></form></section>
{% endblock %}
