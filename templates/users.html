{% extends 'base.html' %}{% block content %}
<div class="heading"><h1>Usuarios</h1><a class="button primary" href="{{ url_for('create_user') }}">Nuevo usuario</a></div>
<div class="card table-wrap"><table><thead><tr><th>ID</th><th>Nombre</th><th>Correo</th><th>Rol</th><th>Acciones</th></tr></thead><tbody>
{% for user in users %}<tr><td>{{ user.id }}</td><td>{{ user.nombre }}</td><td>{{ user.email }}</td><td>{{ user.rol }}</td><td class="actions"><a href="{{ url_for('edit_user', user_id=user.id) }}">Editar</a><form method="post" action="{{ url_for('delete_user', user_id=user.id) }}" onsubmit="return confirm('¿Eliminar este usuario?')"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><button class="danger">Eliminar</button></form></td></tr>
{% else %}<tr><td colspan="5">Aún no hay usuarios.</td></tr>{% endfor %}
</tbody></table></div>{% endblock %}
