{% extends 'base.html' %}{% block content %}
<section class="card narrow"><h1>{{ title }}</h1>
<form method="post"><input type="hidden" name="csrf" value="{{ csrf_token() }}">
<label>Nombre<input name="nombre" maxlength="120" value="{{ request.form.get('nombre', user.nombre if user else '') }}" required></label>
<label>Correo<input type="email" name="email" maxlength="255" value="{{ request.form.get('email', user.email if user else '') }}" required></label>
<label>Rol<select name="rol" required>{% set current = request.form.get('rol', user.rol if user else 'usuario') %}<option value="usuario" {{ 'selected' if current == 'usuario' }}>usuario</option><option value="admin" {{ 'selected' if current == 'admin' }}>admin</option></select></label>
<div class="actions"><button class="primary">Guardar</button><a href="{{ url_for('users') }}">Cancelar</a></div></form></section>
{% endblock %}
